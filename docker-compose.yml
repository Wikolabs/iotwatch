version: "3.9"

# IoTWatch demo — production-ready POC.
# 2 services orchestrated:
#   - iotwatch (Next.js frontend on host port 3029)
#   - iotwatch-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  iotwatch-backend:
    image: ghcr.io/wikolabs/iotwatch-backend:latest
    container_name: iotwatch-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  iotwatch-net:
    name: iotwatch-net
    driver: bridge
